<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0820" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Faith Dash" />
  <meta name="description" content="Faith Dash — a rhythm platformer with Bible trivia and a global leaderboard." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Faith Dash</title>
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="hud" class="hidden" aria-live="polite"></div>
    <div id="screens"></div>
    <div id="overlay-root"></div>
    <div id="toasts" aria-live="assertive"></div>
    <div id="rotate" class="hidden"><div><div class="rot-ico">⟳</div><p>Please rotate your device to landscape to play Faith Dash.</p></div></div>
    <noscript><p style="color:#fff;padding:2rem">Faith Dash needs JavaScript.</p></noscript>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
